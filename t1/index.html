<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Танчики в лабиринте</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>

<div id="wrap">
  <h1>🎮 Танчики в лабиринте</h1>
  <div id="stage">
    <canvas id="game" width="600" height="440"></canvas>
    <div id="respawn">💥 Вы уничтожены...</div>
  </div>
  <div id="hud">
    <div>❤️ HP: <b id="hp">3</b></div>
    <div>💀 Убийства: <b id="kills">0</b></div>
    <div>👥 Игроков онлайн: <b id="online">1</b></div>
  </div>
</div>

<div id="touchControls" class="hidden">
  <div id="dpad">
    <button type="button" class="tbtn tup" aria-label="Вверх">▲</button>
    <button type="button" class="tbtn tleft" aria-label="Влево">◀</button>
    <button type="button" class="tbtn tright" aria-label="Вправо">▶</button>
    <button type="button" class="tbtn tdown" aria-label="Вниз">▼</button>
  </div>
  <button type="button" id="fireBtn" class="tbtn tfire" aria-label="Огонь">🔥</button>
</div>

<div id="overlay">
  <div id="panel">
    <h2>Танчики в лабиринте</h2>
    <p>WASD или стрелки — движение<br>Пробел — выстрел</p>
    <input id="nameInput" type="text" placeholder="Твоё имя" maxlength="16">
    <button id="playBtn">Играть</button>
  </div>
</div>

<script src="game.js?v=2"></script>
</body>
</html>
