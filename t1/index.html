<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Новые люди — игра</title>
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>

<canvas id="game"></canvas>

<div id="hud" class="hidden">
  Длина: <b id="lengthVal">0</b>
</div>

<button id="musicBtn" class="hidden">🔊</button>

<div id="leaderboard" class="hidden">
  <h3>Топ игроков</h3>
  <ol id="lbList"></ol>
</div>

<div id="respawn">💥 Тебя съели...</div>

<div id="overlay">
  <div id="panel">
    <div class="brush b1"></div>
    <div class="brush b2"></div>
    <div class="brush b3"></div>
    <div class="logo">
      <span class="party">ПАРТИЯ</span>
      <span class="brand">НОВЫЕ ЛЮДИ</span>
    </div>
    <p>Веди змею мышкой или пальцем по экрану.<br>Врежешься головой в кого-то — погибнешь ты. Врежутся в тебя — погибнут они.</p>
    <input id="nameInput" type="text" placeholder="Твоё имя" maxlength="16">
    <button id="playBtn">Играть</button>
  </div>
</div>

<script src="game.js?v=4"></script>
</body>
</html>
